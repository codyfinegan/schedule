name: schedule

# Base: what's true in every environment. `docker compose up` auto-merges
# docker-compose.override.yml on top of this for local dev. Prod merges
# docker-compose.prod.yml instead — see readme in each override file.
services:
  # Reverse proxy in front of PHP-FPM. TLS handling differs per environment
  # (see the override files), so this service intentionally defines no
  # ports or Caddyfile mount of its own.
  api-caddy:
    image: caddy:2-alpine
    depends_on:
      - api-php
    restart: unless-stopped

  # The SQLite file lives in a named volume mounted over /app/var, not in
  # the source tree — same separation as the DO Volume in prod, so the DB
  # survives an image rebuild independent of the code either way.
  api-php:
    build:
      context: ./api
      dockerfile: docker/Dockerfile
    volumes:
      - api_var:/app/var
    env_file:
      - ./api/.env
    restart: unless-stopped

volumes:
  api_var:
