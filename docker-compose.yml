name: schedule-backend

services:
  php:
    build:
      context: ./docker/php
    ports:
      - "127.0.0.1:8082:80"
    env_file: .env
    volumes:
      - .:/app
      - ./docker/php/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./docker/php/conf.d/dev.ini:/usr/local/etc/php/conf.d/dev.ini:ro
    tty: true
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8083:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  composer:
    image: composer:2
    profiles: ["tools"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
      - composer_cache:/tmp

  frontend:
    image: node:20-alpine
    profiles: ["tools"]
    working_dir: /app/client
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    command: ["sh", "-c", "npm install && npm run build"]

volumes:
  composer_cache:
