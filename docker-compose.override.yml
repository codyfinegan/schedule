# Dev-only. Docker Compose loads this automatically alongside docker-compose.yml
# whenever you run `docker compose up` with no -f flags — nothing extra to type.
# Everything here has a prod equivalent that lives outside this compose project
# entirely: client -> S3 + CloudFront, mailpit/mail-worker -> Cloudflare Email
# Routing + Worker, TLS -> the sibling `proxy` project instead of Caddy itself.

services:
  # Stands in for S3 + CloudFront: a plain static file server, no app logic.
  # Serves client/dist, same as the S3 bucket only ever holds the built
  # output in prod -- run the pnpm service below to (re)build it.
  client:
    image: caddy:2-alpine
    volumes:
      - ./client/dist:/srv:ro
      - ./client/docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8085:80"
    restart: unless-stopped

  api-caddy:
    volumes:
      - ./api/docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./api/public:/app/public:ro
    ports:
      - "127.0.0.1:8086:80"

  api-php:
    # Bind-mount the source over the image's baked-in copy so edits show up
    # without a rebuild. Prod deliberately omits this — see docker-compose.prod.yml.
    volumes:
      - ./api:/app
      - ./api/var:/app/var # dev: DB on host
    build:
      args:
        PHP_ENV: development

  # Browser UI for the SQLite DB, opened read-only. No prod equivalent --
  # in prod, inspect the file on the droplet's volume directly. Runs as
  # www-data's uid so it can never leave a root-owned file in the volume.
  db-viewer:
    build:
      dockerfile_inline: |
        FROM python:3.12-alpine
        RUN pip install --no-cache-dir sqlite-web==0.8.2
    user: "82:82"
    volumes:
      - ./api/var:/app/var
    command: ["sqlite_web", "--host", "0.0.0.0", "--no-browser", "--read-only", "/app/var/database.sqlite"]
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      - api-php
    restart: unless-stopped

  # SMTP catcher standing in for the real outbound path AND the recipient's
  # inbox — mail-worker reads replies back out of it, same as Cloudflare
  # Email Routing would hand a reply to the Worker in prod.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8087:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  # Local stand-in for the Cloudflare Worker: polls mailpit for replies
  # addressed to the RSVP mailbox, pulls UID + PARTSTAT out of the
  # text/calendar part, and forwards a signed webhook to the API — same
  # job the Worker does, just polling instead of being invoked on receipt.
  mail-worker:
    image: python:3.12-alpine
    volumes:
      - ./mail-worker/worker.py:/worker.py:ro
    environment:
      PYTHONUNBUFFERED: "1"
      MAILPIT_URL: http://mailpit:8025
      WEBHOOK_URL: http://api-caddy/webhooks/rsvp
      RSVP_ADDRESS: ${RSVP_ADDRESS:-rsvp@botc.example.test}
      RSVP_WEBHOOK_SECRET: ${RSVP_WEBHOOK_SECRET:-dev-secret-change-me}
      POLL_SECONDS: "5"
    command: ["python", "/worker.py"]
    depends_on:
      - mailpit
      - api-caddy
    restart: unless-stopped

  composer:
    image: composer:2
    profiles: ["tools"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./api:/app
      - composer_cache:/tmp

  # No Node on the host (see readme) -- pnpm commands for client/ run through
  # this, e.g. `docker compose run --rm pnpm install`, `... pnpm build`.
  pnpm:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    entrypoint: ["npx", "--yes", "pnpm"]
    volumes:
      - ./client:/app

  # Rebuilds client/dist on every save (no HMR -- a full `vite build` rerun
  # per change), so the `client` service above always serves current output.
  # Skips vue-tsc on purpose for a fast loop; run `pnpm build` for the
  # type-checked build before committing.
  client-watch:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    entrypoint: ["npx", "--yes", "pnpm", "exec", "vite", "build", "--watch"]
    volumes:
      - ./client:/app
    restart: unless-stopped

volumes:
  composer_cache:
